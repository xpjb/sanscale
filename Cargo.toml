[package]
name = "sanscale"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Resolution-independent GPU text rendering on wgpu via the Slug algorithm (analytic Bézier coverage)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xpjb/sanscale"
readme = "README.md"
keywords = ["font", "text", "gpu", "wgpu", "slug"]
categories = ["graphics", "rendering", "text-processing"]
exclude = ["/report", "/.github"]

[lib]
path = "src/lib.rs"

[dependencies]
wgpu = "29"
ttf-parser = "0.25"
rustybuzz = "0.20.1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
half = { version = "2", features = ["bytemuck"] }
unicode-segmentation = "1.12"
# Color-emoji (COLR v0/v1) rasterizer for the emoji atlas. Pure Rust, no C deps.
tiny-skia = "0.11"

[dev-dependencies]
# Headless examples/benches: block on the async wgpu device request and dump PNGs.
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# System-font discovery for the fallback-chain examples (CJK, emoji, etc.).
fontdb = "0.22"
# The interactive `unicode_zoom` example opens a window.
winit = "0.30"
# Write reused vertex buffers directly (avoid per-frame buffer allocation).
bytemuck = "1"
# Clipboard: click-to-copy in the interactive examples.
arboard = "3"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
items_after_test_module = "allow"
